<!-- public/404.html -->
<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      const currentPath = window.location.pathname + window.location.search + window.location.hash;
      const redirectURL = '/index.html?redirect=' + encodeURIComponent(currentPath);
      window.location.replace(redirectURL);
    </script>
  </head>
  <body>
    <p>ページを読み込み中です...</p>
  </body>
</html>
